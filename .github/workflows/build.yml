name: Build Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            platform: macos
            ext: ''
          - os: windows-latest
            platform: windows
            ext: '.exe'

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install frontend deps
        run: npm ci
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Copy frontend to static
        shell: bash
        run: |
          rm -rf backend/app/static
          cp -r frontend/dist backend/app/static

      - name: Install Python deps
        run: |
          pip install -r backend/requirements.txt
          pip install pyinstaller eval_type_backport
        shell: bash

      - name: Build executable
        run: |
          python -m PyInstaller ../fastgpt-kb-batch.spec --noconfirm
        working-directory: backend
        shell: bash

      - name: Rename executable
        shell: bash
        run: |
          cd backend/dist
          if [ "${{ matrix.platform }}" = "windows" ]; then
            mv fastgpt-kb-batch.exe fastgpt-kb-batch-windows.exe
          else
            mv fastgpt-kb-batch fastgpt-kb-batch-macos
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fastgpt-kb-batch-${{ matrix.platform }}
          path: backend/dist/fastgpt-kb-batch-${{ matrix.platform }}${{ matrix.ext }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/fastgpt-kb-batch-macos/fastgpt-kb-batch-macos
            artifacts/fastgpt-kb-batch-windows/fastgpt-kb-batch-windows.exe
          generate_release_notes: true
